# nginx in front of Open Duet, as a container on the app's network. Use it with the base file:
#
#   docker compose -f compose.yaml -f deploy/proxy/compose.nginx.yaml up -d --build
#
# Set OPEN_DOTS_DOMAIN (the name people type) and put the certificate at
# $OPEN_DOTS_TLS_DIR/fullchain.pem and the key at $OPEN_DOTS_TLS_DIR/privkey.pem (default ./tls).
#
# The proxy gets a fixed address and the app trusts exactly that address, so only this container's
# X-Forwarded-For and X-Forwarded-Proto are believed; see compose.yaml for why a whole network is
# never named. Do not attach other containers to this network.
services:
  open-dots:
    environment:
      TRUSTED_PROXIES: ${OPEN_DOTS_TRUSTED_PROXIES:-${OPEN_DOTS_PROXY_IP:-172.31.250.10}}

  proxy:
    image: ${OPEN_DOTS_NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      open-dots:
        condition: service_healthy
    environment:
      OPEN_DOTS_DOMAIN: ${OPEN_DOTS_DOMAIN:?set OPEN_DOTS_DOMAIN to the name people use, for example dots.example.com}
    ports:
      - "${OPEN_DOTS_HTTP_BIND:-0.0.0.0}:${OPEN_DOTS_HTTP_PORT:-80}:80"
      - "${OPEN_DOTS_HTTP_BIND:-0.0.0.0}:${OPEN_DOTS_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${OPEN_DOTS_TLS_DIR:-./tls}:/etc/nginx/tls:ro
    networks:
      default:
        ipv4_address: ${OPEN_DOTS_PROXY_IP:-172.31.250.10}
        aliases:
          - ${OPEN_DOTS_DOMAIN}
