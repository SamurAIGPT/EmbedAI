# nginx for Open Dots (an envsubst template: the official image fills in OPEN_DOTS_DOMAIN).
#
# What the server relies on, and this file provides:
#   - X-Forwarded-For is SET to the connecting address, never appended to: a client cannot choose
#     which address its failed sign-ins are counted against.
#   - X-Forwarded-Proto says the visit was HTTPS, so the sign-in cookie is marked Secure.
#   - Host is passed through unchanged (the server answers only to names it knows).
#   - The event stream is not buffered, and long reads and writes are allowed.
#   - Uploads up to the server's own 10 MB image limit (plus form overhead) pass; the server, not
#     nginx, says "too large".
#   - /hooks/ goes to the app like everything else: webhooks carry their own per-routine secret.
# nginx finds the app by name at request time, so recreating the app container needs no reload.

server {
    listen 80;
    server_name ${OPEN_DOTS_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${OPEN_DOTS_DOMAIN};

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://open-dots:8000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/api/v1/threads/[0-9]+/events/stream$ {
        proxy_pass $app;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass $app;
    }
}
